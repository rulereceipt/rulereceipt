name: Claude Code compat watch

# Weekly: notice when a new Claude Code version ships, so we re-verify that our
# transcript parsing still holds against it before a user hits a broken parse.
# It does NOT post anywhere — it fails the job and writes a step summary, which
# shows up in the Actions tab for a human to review and bump the baseline.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      # Our suite must still pass — if a dependency or our own code rotted, catch it here too.
      - run: npm test

      - name: Compare latest Claude Code version to our recorded baseline
        run: |
          set -euo pipefail
          BASELINE="$(tr -d '[:space:]' < .github/claude-code-version.txt)"
          LATEST="$(npm view @anthropic-ai/claude-code version)"
          echo "Baseline we last verified against: $BASELINE"
          echo "Latest on npm:                     $LATEST"
          {
            echo "## Claude Code compat watch"
            echo ""
            echo "- Baseline (last verified): \`$BASELINE\`"
            echo "- Latest on npm: \`$LATEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$BASELINE" != "$LATEST" ]; then
            {
              echo ""
              echo "⚠️ A new Claude Code version shipped. Re-verify transcript parsing against it"
              echo "(run the adapter tests against a real $LATEST session), then bump"
              echo "\`.github/claude-code-version.txt\` to \`$LATEST\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Claude Code $LATEST is newer than verified baseline $BASELINE — re-verify parsing and bump the baseline."
            exit 1
          fi
          echo "Baseline is current — nothing to do."
