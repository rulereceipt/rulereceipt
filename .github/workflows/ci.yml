name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # engines is ">=20", and the matrix tests exactly that: the declared
    # floor (20) and current LTS (22). Node 18 was dropped 2026-09-29 — it
    # was advertised in engines but never in CI, and it is EOL, so the claim
    # was untested. The rule is: we test every version we claim to support.
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run license:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Cold-install guard: the exact commands a stranger runs after `npx`
      # must exit clean (no stack trace) on the freshly-built dist, and the
      # self-test's golden fixtures must all still be correct. A green unit
      # suite does not prove the built CLI actually starts — this does.
      - run: bash scripts/smoke.sh
      - run: node dist/cli.js selftest

      # Open-core guard: fail if the publishable tarball would contain anything
      # beyond the built CLI + metadata (no corpus/, data/, local/, tests/,
      # team/cloud code, or secrets). A silent leak in a future release is a
      # hard CI failure here instead.
      - run: node scripts/check-package.mjs

      # Blocking gate on what actually ships. Dev-only advisories (a test
      # runner, a types package) cannot affect a published CLI or a
      # deployed function, so gating on them means a permanently red CI
      # that everyone learns to ignore -- which is worse than no gate.
      - run: npm audit --omit=dev --audit-level=high

      # Dev advisories stay visible, without blocking. Reviewed, not ignored.
      - name: Dev dependency advisories (informational)
        run: npm audit --audit-level=high || true

  test-landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Dev dependency advisories (informational)
        run: npm audit --audit-level=high || true
