name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Blocking gate on what actually ships. Dev-only advisories (a test
      # runner, a types package) cannot affect a published CLI or a
      # deployed function, so gating on them means a permanently red CI
      # that everyone learns to ignore -- which is worse than no gate.
      - run: npm audit --omit=dev --audit-level=high

      # Dev advisories stay visible, without blocking. Reviewed, not ignored.
      - name: Dev dependency advisories (informational)
        run: npm audit --audit-level=high || true

  test-landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Dev dependency advisories (informational)
        run: npm audit --audit-level=high || true
