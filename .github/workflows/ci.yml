name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # package.json declares engines ">=18", but CI only ever ran one
    # version, so that claim was never actually tested. This runs the
    # oldest version still supported by that range alongside current LTS,
    # so a Node-version-specific break is caught here rather than by a
    # user on a version we claimed to support.
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Blocking gate on what actually ships. Dev-only advisories (a test
      # runner, a types package) cannot affect a published CLI or a
      # deployed function, so gating on them means a permanently red CI
      # that everyone learns to ignore -- which is worse than no gate.
      - run: npm audit --omit=dev --audit-level=high

      # Dev advisories stay visible, without blocking. Reviewed, not ignored.
      - name: Dev dependency advisories (informational)
        run: npm audit --audit-level=high || true

  test-landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Dev dependency advisories (informational)
        run: npm audit --audit-level=high || true
