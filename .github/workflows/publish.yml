name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 22, not 20, and the two reasons are linked: Node 20 left
      # support in April 2026, and npm@latest (12.x) now REQUIRES Node
      # >=22.22.2. On Node 20 the `npm install -g npm@latest` step below
      # fails EBADENGINE and no publish happens at all (real failure,
      # 2026-08-31, run 33362264889).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Trusted publishing needs a recent npm CLI (11.5.1+) -- don't rely
      # on whatever version actions/setup-node's Node bundles.
      #
      # Pinned exactly, not @latest. This is the step that publishes the
      # package: @latest means whichever npm happens to be newest at
      # publish time runs with id-token: write in scope, so a bad npm
      # release lands straight in the release path with no review. A
      # stale pin fails loudly and visibly; an unpinned one fails
      # silently. Bump deliberately -- Dependabot does not track this.
      - run: npm install -g npm@12.0.2

      # The tag is what triggers this workflow, but package.json is what
      # actually determines the published version. If they disagree, a
      # v0.1.19 tag silently publishes 0.1.18 (or fails confusingly on a
      # duplicate). Fail here, before anything is built or sent.
      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # Same split as ci.yml, for the same documented reason: only
      # production dependencies can reach someone who installs this
      # package, so those are the blocking gate. A dev-only advisory (a
      # test runner, a types package) blocking a release would mean a real
      # fix can't ship because an unrelated tool has an open advisory.
      # Retried, because the failure mode here is npm's advisory endpoint
      # timing out rather than an advisory being found — that killed the
      # v0.1.27 release after every other gate had passed. The retry does
      # not weaken the gate: a real high-severity advisory fails all three
      # attempts identically and still blocks the publish. It only stops a
      # transient outage at registry.npmjs.org from deciding whether a fix
      # can ship. Still fails closed after three tries.
      - name: Audit production dependencies (blocking)
        run: |
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm audit attempt $attempt failed; retrying in 20s"
              sleep 20
            fi
          done
          echo "npm audit failed three times — refusing to publish"
          exit 1
      - name: Dev dependency advisories (informational)
        run: npm audit --audit-level=high || true

      # no NPM_TOKEN anywhere: this repo/workflow must be configured as a
      # trusted publisher on npmjs.com first (package settings -> Trusted
      # Publisher -> GitHub Actions -> this repo + this workflow file).
      # Until that's done, this step fails closed rather than falling back
      # to an unsigned/unattested publish.
      - run: npm publish --provenance --access public
