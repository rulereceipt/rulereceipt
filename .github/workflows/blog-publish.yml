name: Publish blog (scheduled)

# Rebuilds the static blog daily. A post with draft:false whose date has arrived
# (date <= today) gets built and committed, which triggers the Vercel deploy.
# Deterministic output: if nothing crossed its date, there is no diff and no commit.

on:
  schedule:
    - cron: "10 13 * * *" # 13:10 UTC daily
  workflow_dispatch: {}

# Least privilege: top-level read-only; the one job that commits elevates to write
# (OpenSSF Scorecard Token-Permissions).
permissions:
  contents: read

concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the rebuilt blog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Build blog
        run: node landing/build-blog.mjs
      - name: Commit if a post came due
        run: |
          git config user.name "rulereceipt"
          git config user.email "hello@rulereceipt.dev"
          if git diff --quiet -- landing/blog; then
            echo "no blog changes — nothing due today"
          else
            git add landing/blog
            git commit -m "chore(blog): publish scheduled post(s)"
            git push
          fi
