<title>RuleReceipt — Unsubscribe</title>
<meta name="description" content="Remove your email from the RuleReceipt signup list." />

<style>
  body { margin:0; background:#FAF9F5; color:#141413; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:17px; line-height:1.6; }
  .wrap { max-width:520px; margin:0 auto; padding:60px 24px 80px; }
  a { color:#AD4A17; }
  h1 { font-size:1.8rem; margin-bottom:6px; }
  p { color:#55534E; }
  .back { display:inline-block; margin-bottom:30px; font-size:0.85rem; }
  form { display:flex; gap:10px; flex-wrap:wrap; margin-top:24px; }
  input[type="email"] {
    flex:1; min-width:220px; padding:12px 14px; border:1px solid #DEDCD1; border-radius:8px;
    font-size:1rem; font-family:inherit; background:#FFFFFF; color:#141413;
  }
  input[type="email"]:focus { outline:2px solid #C4551F; outline-offset:1px; }
  button {
    padding:12px 20px; border:none; border-radius:8px; background:#141413; color:#FAF9F5;
    font-size:1rem; font-family:inherit; cursor:pointer;
  }
  button:hover { background:#55534E; }
  button:disabled { opacity:0.6; cursor:default; }
  .note { margin-top:14px; font-size:0.9rem; min-height:1.2em; }
  .note.ok { color:#17805F; }
  .note.err { color:#B3261E; }

  /* ---- shared design system (see index.html for the colour rule) ----
     Green and red mean a verdict and nothing else; terracotta does all
     interface work. These pages were left on the old palette when the
     landing page moved, so green still meant "clickable" here. */
  h1, h2 {
    font-family: 'Newsreader', 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    font-weight: 600;
    letter-spacing: -0.015em;
    text-transform: none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/">&larr; RuleReceipt</a>
    <h1>Unsubscribe</h1>
    <p>Type the email you signed up with. It will be removed from our list immediately — no confirmation email, no further contact.</p>

    <form id="unsub-form">
      <input type="email" id="unsub-email" placeholder="you@example.com" required>
      <button type="submit">Remove me</button>
    </form>
    <div class="note" id="unsub-note"></div>

    <p style="margin-top:36px; font-size:0.85rem; color:#7A756E;">
      Prefer email? <a href="mailto:hello@rulereceipt.dev">hello@rulereceipt.dev</a> works too.
    </p>
  </div>

<script>
  var form = document.getElementById('unsub-form');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var emailInput = document.getElementById('unsub-email');
    var note = document.getElementById('unsub-note');
    var button = form.querySelector('button');
    var email = emailInput.value.trim();

    button.disabled = true;
    note.textContent = '';
    note.className = 'note';

    fetch('/api/unsubscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email }),
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, data: d }; }); })
      .then(function (result) {
        button.disabled = false;
        if (!result.ok) {
          note.textContent = result.data.error || 'Something went wrong. Try again.';
          note.className = 'note err';
          return;
        }
        note.textContent = "Done — you've been removed.";
        note.className = 'note ok';
        emailInput.value = '';
      })
      .catch(function () {
        button.disabled = false;
        note.textContent = 'Could not reach the server. Try again, or email hello@rulereceipt.dev directly.';
        note.className = 'note err';
      });
  });
</script>
</body>
</html>
